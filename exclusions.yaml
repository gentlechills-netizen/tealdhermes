# exclusions.yaml — Commandes à ignorer dans tldrh
# Ces commandes sont exclues manuellement : trop avancées, enfantines,
# ou non pertinentes pour le public cible.
#
# Le générateur scrape TOUTES les commandes de la page docs,
# puis retire celles listées ici. Commandes messaging-only
# (gateway_only=True) sont filtrées automatiquement par le générateur.

